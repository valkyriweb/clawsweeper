name: Create ClawSweeper state token
description: Mint a GitHub App token for the generated state repository.
inputs:
  client-id:
    description: GitHub App client ID.
    required: true
  private-key:
    description: GitHub App private key.
    required: true
  owner:
    description: State repository owner.
    required: false
    default: valkyriweb
  repository:
    description: State repository name.
    required: false
    default: clawsweeper-state
  actions-permission:
    description: Optional Actions permission for state workflow dispatch.
    required: false
    default: ""
  contents-permission:
    description: Contents permission for state checkout and publication.
    required: false
    default: write
outputs:
  token:
    description: GitHub App installation token for the state repository.
    value: ${{ steps.state-token.outputs.token }}
runs:
  using: composite
  steps:
    - name: Create state repository token
      id: state-token
      uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ inputs.owner }}
        repositories: ${{ inputs.repository }}
        # Keep an explicit downscope when callers omit both optional grants.
        permission-metadata: read
        permission-actions: ${{ inputs.actions-permission }}
        permission-contents: ${{ inputs.contents-permission }}
