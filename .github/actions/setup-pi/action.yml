name: Setup Pi CLI
description: Ensure the Pi coding-agent CLI is installed and authenticated on the runner.
inputs:
  version:
    description: "@valkyriweb/pi-coding-agent version. Empty installs the latest published package."
    default: ""
  profile-package:
    description: Versioned Pi profile package to load from ~/.pi/agent/settings.json.
    default: "@valkyriweb/my-pi-actions"
  profile-version:
    description: Pi profile package version. Empty installs the latest published package.
    default: "0.6.38"
  token:
    description: >-
      GitHub Packages token with read:packages. Must be a PAT (or other user
      token): @valkyriweb/my-pi-actions is a user-account-scoped package that
      GitHub App installation tokens cannot read. Empty uses github.token.
    default: ""
  cache-suffix:
    description: Extra cache key suffix for target-tool downloads.
    default: ""
runs:
  using: composite
  steps:
    # See setup-codex / setup-claude-code for the self-hosted cache-skip
    # rationale (perf PR #60). Hosted runners still benefit from caching
    # ~/.npm because $HOME is ephemeral.
    - name: Cache npm downloads
      if: runner.environment != 'self-hosted'
      uses: actions/cache@v5
      with:
        path: |
          ~/.npm
          ~/.cache/node/corepack
        key: ${{ runner.os }}-node24-pi-${{ inputs.version || 'latest' }}-${{ inputs.profile-package }}-${{ inputs.profile-version || 'latest' }}-${{ inputs['cache-suffix'] || 'default' }}-v2
        restore-keys: |
          ${{ runner.os }}-node24-pi-${{ inputs.version || 'latest' }}-${{ inputs.profile-package }}-
          ${{ runner.os }}-node24-pi-

    - name: Install pinned Pi CLI and profile
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.token || github.token }}
        PI_VERSION: ${{ inputs.version }}
        PI_PROFILE_PACKAGE: ${{ inputs.profile-package }}
        PI_PROFILE_VERSION: ${{ inputs.profile-version }}
      run: |
        set -euo pipefail
        npmrc="$(mktemp)"
        trap 'rm -f "$npmrc"' EXIT
        printf '%s\n' '@valkyriweb:registry=https://npm.pkg.github.com' > "$npmrc"
        if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
          printf '%s\n' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> "$npmrc"
        fi
        export NPM_CONFIG_USERCONFIG="$npmrc"
        host_package="@valkyriweb/pi-coding-agent"
        pi_package="$host_package"
        profile_package="$PI_PROFILE_PACKAGE"
        if [ -n "$PI_VERSION" ]; then
          pi_package="$pi_package@$PI_VERSION"
        fi
        if [ -n "$PI_PROFILE_VERSION" ]; then
          profile_package="$profile_package@$PI_PROFILE_VERSION"
        fi
        # --ignore-scripts: the only dependency with an install script is koffi
        # (pulled in via pi-tui), which ships prebuilt .node binaries for every
        # platform in its tarball and loads fine without the cnoke prebuild step.
        # The persistent self-hosted runner intermittently ends up with a koffi
        # copy missing src/cnoke/cnoke.js, which fails the install script; no dep
        # here needs a build/postinstall, so skipping scripts is both the fix and
        # a speedup.
        npm install -g --ignore-scripts "$pi_package" "$profile_package"
        installed="$(pi --version 2>&1 | head -1 || true)"
        echo "pi installed: $installed"
        profile_root="$(npm root -g)/$PI_PROFILE_PACKAGE"
        if [ ! -f "$profile_root/package.json" ]; then
          echo "::error::Pi profile package not found after install: $profile_root" >&2
          exit 1
        fi
        # npm leaves a bundling profile's own registry deps uninstalled, so its
        # bundled members cannot load. Install them into the global root, which
        # Node reaches when it walks up from the members.
        deps_list="$(node -e '
          const m = require(process.argv[1]);
          const bundled = new Set(m.bundledDependencies ?? m.bundleDependencies ?? []);
          for (const [name, range] of Object.entries(m.dependencies ?? {})) {
            if (!bundled.has(name)) console.log(`${name}@${range}`);
          }' "$profile_root/package.json")"
        profile_deps=()
        while IFS= read -r dep; do
          if [ -n "$dep" ]; then profile_deps+=("$dep"); fi
        done <<< "$deps_list"
        if [ "${#profile_deps[@]}" -gt 0 ]; then
          npm install -g --ignore-scripts "${profile_deps[@]}"
        fi
        mkdir -p "$HOME/.pi/agent"
        node - "$HOME/.pi/agent/settings.json" "$profile_root" "$host_package" <<'NODE'
        const fs = require("node:fs");
        const path = require("node:path");
        const [settingsPath, profileRoot, hostPackage] = process.argv.slice(2);
        const manifestPath = path.join(profileRoot, "package.json");
        const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
        const missing = (manifest.pi?.extensions ?? [])
          .map((entry) => path.resolve(profileRoot, entry))
          .filter((entry) => !fs.existsSync(entry));
        if (missing.length > 0) {
          console.error(`Pi profile has missing extension entries: ${missing.join(", ")}`);
          process.exit(1);
        }
        // Profiles peer on the host Pi packages, which the host aliases for its
        // extensions. A profile built for another host scope cannot load here.
        const hostPeers = new Set(Object.keys(manifest.peerDependencies ?? {}));
        if (!hostPeers.has(hostPackage)) {
          console.error(`::error::Pi profile peers on ${[...hostPeers].join(", ") || "nothing"}, not the installed host ${hostPackage}`);
          process.exit(1);
        }
        // A bundled member's deps must resolve from the installed tree, or Pi
        // fails at extension load and the review step swallows it.
        const resolves = (fromDir, name) => {
          for (let dir = fromDir; ; dir = path.dirname(dir)) {
            if (fs.existsSync(path.join(dir, "node_modules", name, "package.json"))) return true;
            if (dir === path.dirname(dir)) return false;
          }
        };
        const unresolved = [];
        for (const member of manifest.bundledDependencies ?? manifest.bundleDependencies ?? []) {
          const memberDir = path.join(profileRoot, "node_modules", member);
          const memberManifestPath = path.join(memberDir, "package.json");
          if (!fs.existsSync(memberManifestPath)) {
            unresolved.push(`${member} (not installed)`);
            continue;
          }
          const memberManifest = JSON.parse(fs.readFileSync(memberManifestPath, "utf8"));
          const requiredPeers = Object.keys(memberManifest.peerDependencies ?? {}).filter(
            (dep) => !hostPeers.has(dep) && memberManifest.peerDependenciesMeta?.[dep]?.optional !== true,
          );
          for (const dep of [...Object.keys(memberManifest.dependencies ?? {}), ...requiredPeers]) {
            if (!resolves(memberDir, dep)) unresolved.push(`${member} -> ${dep}`);
          }
        }
        if (unresolved.length > 0) {
          console.error(`::error::Pi profile has unresolved bundled dependencies: ${unresolved.join(", ")}`);
          process.exit(1);
        }
        const settings = fs.existsSync(settingsPath) ? JSON.parse(fs.readFileSync(settingsPath, "utf8")) : {};
        settings.packages = [profileRoot];
        settings.subagents = {
          ...(settings.subagents ?? {}),
          providers: {
            ...(settings.subagents?.providers ?? {}),
            anthropic: { ...(settings.subagents?.providers?.anthropic ?? {}), model: "fast" },
            "claude-bridge": { ...(settings.subagents?.providers?.["claude-bridge"] ?? {}), model: "fast" },
            openai: { ...(settings.subagents?.providers?.openai ?? {}), model: "fast" }
          }
        };
        fs.writeFileSync(settingsPath, `${JSON.stringify(settings, null, 2)}\n`);
        NODE

    - name: Verify Pi profile config
      shell: bash
      run: |
        set -euo pipefail
        test -x "$(command -v pi)"
        test -f "$HOME/.pi/agent/settings.json"
        node -e 'const s=require(process.env.HOME+"/.pi/agent/settings.json"); if (!Array.isArray(s.packages) || !s.packages.some((p)=>String(p).includes("my-pi-actions"))) process.exit(1); console.log("pi profile packages:", s.packages.join(", "));'
