name: Setup ClawSweeper state
description: Checkout generated state and hydrate it into the ClawSweeper worktree.
inputs:
  token:
    description: GitHub token with contents read/write access to the state repo.
    required: true
  state-repository:
    description: Generated state repository.
    required: false
    default: valkyriweb/clawsweeper-state
  state-ref:
    description: Generated state branch.
    required: false
    default: state
  state-path:
    description: Checkout path for the generated state repository.
    required: false
    default: clawsweeper-state
  worktree-path:
    description: ClawSweeper checkout path to hydrate.
    required: false
    default: .
  node-version:
    description: Node.js version used to run the TypeScript hydrator.
    required: false
    default: "24.22.1"
  filter:
    description: Git partial clone filter for the generated state repository.
    required: false
    default: blob:none
  fetch-depth:
    description: Git fetch depth for the generated state repository. Keep 0 for publish jobs that may rebase.
    required: false
    default: "0"
runs:
  using: composite
  steps:
    - uses: actions/checkout@v6
      with:
        repository: ${{ inputs.state-repository }}
        ref: ${{ inputs.state-ref }}
        path: ${{ inputs.state-path }}
        token: ${{ inputs.token }}
        filter: ${{ inputs.filter }}
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Export state root
      shell: bash
      env:
        INPUTS_STATE_PATH: ${{ inputs['state-path'] }}
      run: |
        # Keep spaces, but reject record separators and parent traversal before
        # the value becomes a GITHUB_ENV record.
        if [[ ! "$INPUTS_STATE_PATH" =~ ^[^$'\r\n']+$ ]] || [[ "/$INPUTS_STATE_PATH/" == */../* ]]; then
          echo "::error::Invalid state-path." >&2
          exit 1
        fi
        echo "CLAWSWEEPER_STATE_DIR=$GITHUB_WORKSPACE/${INPUTS_STATE_PATH}" >> "$GITHUB_ENV"

    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Hydrate generated state
      shell: bash
      env:
        CLAWSWEEPER_STATE_DIR: ${{ inputs.state-path }}
        INPUTS_WORKTREE_PATH: ${{ inputs['worktree-path'] }}
        INPUTS_STATE_PATH: ${{ inputs['state-path'] }}
      run: node "${INPUTS_WORKTREE_PATH}/scripts/hydrate-state.ts" --state-dir "${INPUTS_STATE_PATH}" --worktree "${INPUTS_WORKTREE_PATH}"
