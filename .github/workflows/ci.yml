name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "apply-report.json"
      - "repair-apply-report.json"
      - "jobs/**"
      - "records/**"
      - "results/**"
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check
    # Hosted on purpose. This job does not call ClawRouter. The public repo's
    # standard ubuntu-latest minutes are free, and the ARC label is preemptible.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            config
            convex
            convex.json
            dashboard
            docs
            instructions
            prompts
            schema
            scripts
            src
            test
            .oxfmtrc.json
            AGENTS.md
            README.md
            package.json
            pnpm-lock.yaml
            tsconfig.convex.json
            tsconfig.dashboard.json
            tsconfig.json
            tsconfig.repair.json
            tsconfig.scripts.json
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-pnpm

      - name: Run check
        run: pnpm run check

  revert-rehearsal:
    name: revert-rehearsal
    if: github.event_name == 'pull_request'
    # Same hosted runner as pnpm check. Advisory: no secrets, tokens or model calls.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Full commit history (blobs on demand) so git can find the merge base of
      # the tested base and the head.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Disable git hooks
        run: git config core.hooksPath /dev/null

      - name: Rehearse squash merge and revert
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/revert-rehearsal.sh "$BASE_SHA" "$HEAD_SHA"
