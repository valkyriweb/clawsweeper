name: debug-checks-token

# Temporary diagnostic for #197: why does the create-github-app-token checks token
# 403 on POST /check-runs when a manually minted checks:write token returns 201?
# A/B: restricted (permission-checks: write) vs full installation token, on both
# ubuntu-latest and the self-hosted runner. Delete once #197 is understood.

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: head_sha for the probe check-run
        required: true

env:
  CLAWSWEEPER_APP_CLIENT_ID: Iv23lirdjmVqYd1gwY26

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - self-hosted-mac-mini
    runs-on: ${{ matrix.runner == 'self-hosted-mac-mini' && fromJson('["self-hosted", "macOS", "ARM64", "mac-mini"]') || 'ubuntu-latest' }}
    steps:
      - name: Mint RESTRICTED token (permission-checks write)
        id: restricted
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ env.CLAWSWEEPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: valkyriweb
          repositories: clawsweeper
          permission-checks: write

      - name: POST check-run with RESTRICTED token
        env:
          GH_TOKEN: ${{ steps.restricted.outputs.token }}
        run: |
          set -euo pipefail
          cat > payload.json <<JSON
          {"name":"debug-restricted-${{ matrix.runner }}","head_sha":"${{ inputs.commit_sha }}","status":"completed","conclusion":"neutral","output":{"title":"debug","summary":"debug"}}
          JSON
          echo "== RESTRICTED =="
          gh api --include --method POST repos/valkyriweb/clawsweeper/check-runs --input payload.json 2>&1 \
            | grep -iE "^HTTP|x-accepted-github-permissions|x-oauth-scopes|Resource not accessible|\"id\":" | head -20 || true

      - name: Mint FULL token (no permission restriction)
        id: full
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ env.CLAWSWEEPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: valkyriweb
          repositories: clawsweeper

      - name: POST check-run with FULL token
        env:
          GH_TOKEN: ${{ steps.full.outputs.token }}
        run: |
          set -euo pipefail
          cat > payload2.json <<JSON
          {"name":"debug-full-${{ matrix.runner }}","head_sha":"${{ inputs.commit_sha }}","status":"completed","conclusion":"neutral","output":{"title":"debug","summary":"debug"}}
          JSON
          echo "== FULL =="
          gh api --include --method POST repos/valkyriweb/clawsweeper/check-runs --input payload2.json 2>&1 \
            | grep -iE "^HTTP|x-accepted-github-permissions|x-oauth-scopes|Resource not accessible|\"id\":" | head -20 || true
