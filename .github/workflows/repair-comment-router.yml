name: repair comment router

on:
  repository_dispatch:
    types: [clawsweeper_comment, clawsweeper_review_lifecycle]
  workflow_dispatch:
    inputs:
      execute:
        description: "Post replies and dispatch repair workers"
        required: true
        default: false
        type: boolean
      lifecycle_only:
        description: "Reconcile opted-in Pi lifecycle receipts without scanning generic commands"
        required: true
        default: false
        type: boolean
      force_reprocess:
        description: "Replay matching comments even if their current version is already in the ledger"
        required: true
        default: false
        type: boolean
      target_repo:
        description: "Repository to scan for ClawSweeper commands"
        required: true
        default: valkyriweb/clawsweeper
        type: string
      lookback_minutes:
        description: "How far back to scan comments"
        required: true
        default: "180"
        type: string
      since:
        description: "Optional ISO timestamp lower bound for scanned comments"
        required: false
        default: ""
        type: string
      max_comments:
        description: "Maximum recent comments to inspect"
        required: true
        default: "100"
        type: string
      item_numbers:
        description: "Optional comma-separated issue or PR numbers to route directly"
        required: false
        default: ""
        type: string
      comment_ids:
        description: "Optional comma-separated issue comment ids to route directly"
        required: false
        default: ""
        type: string
      runner:
        description: "Runner label for repair planning/review work"
        required: true
        default: '["self-hosted","macOS","ARM64","mac-mini"]'
        type: string
      execution_runner:
        description: "Runner label for fix/apply execution work"
        required: true
        default: '["self-hosted","macOS","ARM64","mac-mini"]'
        type: string
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DISPATCH_TARGET_REPO: ${{ github.event.client_payload.target_repo }}
  DISPATCH_LOOKBACK_MINUTES: ${{ github.event.client_payload.lookback_minutes || vars.CLAWSWEEPER_COMMENT_LOOKBACK_MINUTES || '180' }}
  DISPATCH_MAX_COMMENTS: ${{ github.event.client_payload.max_comments || '1' }}
  DISPATCH_ITEM_NUMBER: ${{ github.event.client_payload.item_number || '' }}
  DISPATCH_COMMENT_ID: ${{ github.event.client_payload.comment_id || '' }}
  DISPATCH_STATUS_COMMENT_ID: ${{ github.event.client_payload.status_comment_id || '' }}
  DISPATCH_FORCE_REPROCESS: ${{ github.event.client_payload.force_reprocess || 'false' }}
  CLAWSWEEPER_APP_CLIENT_ID: Iv23lirdjmVqYd1gwY26
  # See sweep.yml comment + issue #68 — sticky-comment patchable-author allowlist override.
  CLAWSWEEPER_COMMENT_AUTHOR_LOGIN: ${{ vars.CLAWSWEEPER_COMMENT_AUTHOR_LOGIN || '' }}
  CLAWSWEEPER_LIFECYCLE_ONLY: ${{ inputs.lifecycle_only && 'true' || 'false' }}
  CLAWSWEEPER_LIFECYCLE_EVENT: ${{ github.event.action == 'clawsweeper_review_lifecycle' && github.event_path || '' }}
  CLAWROUTER_BASE_URL: ${{ vars.CLAWROUTER_BASE_URL || 'https://clawrouter.lue-kube.bermont.digital/v1' }}
  CLAWSWEEPER_LIFECYCLE_FALLBACK_MODEL: ${{ vars.CLAWSWEEPER_LIFECYCLE_FALLBACK_MODEL || 'clawrouter/claude-sonnet-5-200k' }}

concurrency:
  # Preflight must not replace a pending production router run in its concurrency group.
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.lifecycle_only && !inputs.execute && format('repair-classifier-preflight-{0}', github.ref) || format('repair-comment-router-{0}', github.event.inputs.target_repo || github.event.client_payload.target_repo || 'valkyriweb/clawsweeper') }}
  cancel-in-progress: false

jobs:
  # Scheduled ticks fan out one workflow_dispatch per configured target
  # repository instead of routing a single vars.CLAWSWEEPER_TARGET_REPO.
  # Each child run resolves its own owner-scoped app token, and per-repo
  # concurrency groups keep overlapping sweeps serialized. GITHUB_TOKEN is
  # allowed to create workflow_dispatch runs (documented exception to the
  # no-recursive-triggers rule).
  fan-out-scheduled-sweep:
    if: ${{ github.event_name == 'schedule' && (vars.CLAWSWEEPER_COMMENT_ROUTER_EXECUTE || '0') == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            config/target-repositories.json
          sparse-checkout-cone-mode: false

      - name: Dispatch router per target repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          failed=0
          # Interim: skip valkyriweb/paperclip fan-out — ClawSweeper App install
          # Not Found on /repos/valkyriweb/paperclip/installation (Luke skipped
          # App-install widget). Keep paperclip in config/target-repositories.json
          # for other automation; restore after Luke installs the App.
          while IFS=$'\t' read -r repo lifecycle_only; do
            echo "dispatching router for $repo (lifecycle_only=$lifecycle_only)"
            if ! gh workflow run repair-comment-router.yml \
              -R "${{ github.repository }}" \
              -r "${{ github.ref_name }}" \
              -f execute=true \
              -f lifecycle_only="$lifecycle_only" \
              -f target_repo="$repo"; then
              echo "::warning::dispatch failed for $repo"
              failed=$((failed+1))
            fi
          done < <(jq -r '
            .repositories[]
            | select(.target_repo != "valkyriweb/paperclip")
            | select(.skip_comment_router_schedule != true or .pi_review_lifecycle == true)
            | [.target_repo, (.pi_review_lifecycle == true | tostring)] | @tsv
          ' config/target-repositories.json)
          [ "$failed" -eq 0 ] || exit 1

  classifier-preflight:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.lifecycle_only && !inputs.execute }}
    # Use the existing private-network pool, just like the classifier's router job.
    runs-on: ${{ fromJSON(vars.CLAWSWEEPER_RUNNER_LABELS || '["self-hosted","lue-clawsweeper"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          build-script: build:repair
      - name: Verify lifecycle classifier access (read-only preflight)
        env:
          CLAWROUTER_API_KEY: ${{ secrets.CLAWROUTER_API_KEY }}
        run: |
          node --input-type=module <<'JS'
          import { classifyReviewText } from './dist/repair/pr-lifecycle-classifier.js';
          const evidence = 'Documentation review: docs/setup.md links to a nonexistent ../missing.md. Replace it with the existing ../README.md. This is a concrete broken relative link.';
          const result = await classifyReviewText(evidence);
          console.log(JSON.stringify({ probe: 'jev', ...result }));
          if (result.source !== 'jev' || result.classification !== 'actionable') process.exitCode = 1;
          // Client-local fixture only: prove the real fallback without changing provider state.
          const fallback = await classifyReviewText(evidence, {
            fetch: async (url, options) => String(url).endsWith('/native/typesafe/v1/systemone')
              ? new Response('', { status: 503 })
              : fetch(url, options),
          });
          console.log(JSON.stringify({ probe: 'forced-fallback', ...fallback }));
          if (fallback.source !== 'fallback' || fallback.classification !== 'actionable') process.exitCode = 1;
          JS

  route-comments:
    # Scheduled ticks fan out above; read-only classifier probes never enter
    # the router's token creation or ledger publication steps.
    if: ${{ github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.lifecycle_only && !inputs.execute) }}
    # The router calls private ClawRouter endpoints; downstream worker inputs do not select this runner.
    runs-on: ${{ fromJSON(vars.CLAWSWEEPER_RUNNER_LABELS || '["self-hosted","lue-clawsweeper"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          fetch-depth: 0
          sparse-checkout: |
            .github
            config
            jobs
            results
            scripts/hydrate-state.ts
            src/repair
            src/model-registry.ts
            src/repository-profiles.ts
            src/review-tier-drift.ts
            src/usage-telemetry.ts
            package.json
            pnpm-lock.yaml
            tsconfig.repair.json
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-pnpm
        with:
          build-script: build:repair

      - name: Resolve target owner
        id: target-owner
        env:
          TARGET_REPO: ${{ github.event_name == 'workflow_dispatch' && inputs.target_repo || github.event.client_payload.target_repo || vars.CLAWSWEEPER_TARGET_REPO }}
        run: |
          set -euo pipefail
          echo "repo=$TARGET_REPO" >> "$GITHUB_OUTPUT"
          echo "owner=${TARGET_REPO%%/*}" >> "$GITHUB_OUTPUT"

      # Route through the static create-target-token facade so bermont-digital
      # profiles mint with BERMONT_DIGITAL_* credentials instead of the legacy
      # Valkyriweb-only guard. review_only targets get comment scope; full
      # targets keep mutate. Home-repo dispatches use GITHUB_TOKEN.
      - name: Resolve target authorization
        id: target-auth
        env:
          TARGET_REPO: ${{ steps.target-owner.outputs.repo }}
        run: |
          set -euo pipefail
          pnpm run --silent workflow -- target-auth --target-repo "$TARGET_REPO" --access-mode comment >> "$GITHUB_OUTPUT"

      - name: Create target token
        id: app_token
        uses: ./.github/actions/create-target-token
        with:
          target-repo: ${{ steps.target-owner.outputs.repo }}
          access-mode: ${{ steps.target-auth.outputs.automation_policy == 'review_only' && 'comment' || 'mutate' }}
          valkyriweb-client-id: ${{ env.CLAWSWEEPER_APP_CLIENT_ID }}
          valkyriweb-private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          bermont-digital-client-id: ${{ vars.BERMONT_DIGITAL_CLAWSWEEPER_APP_CLIENT_ID }}
          bermont-digital-private-key: ${{ secrets.BERMONT_DIGITAL_CLAWSWEEPER_APP_PRIVATE_KEY }}

      - name: Create state token
        id: state-token
        uses: ./.github/actions/create-state-token
        with:
          client-id: ${{ env.CLAWSWEEPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: valkyriweb

      - uses: ./.github/actions/setup-state
        with:
          token: ${{ steps.state-token.outputs.token }}
          state-repository: valkyriweb/clawsweeper-state

      - name: Route ClawSweeper comments
        env:
          CLAWROUTER_API_KEY: ${{ secrets.CLAWROUTER_API_KEY }}
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          CLAWSWEEPER_DISPATCH_TOKEN: ${{ github.token }}
          CLAWSWEEPER_MUTATION_TOKEN_SOURCE: clawsweeper-app
          CLAWSWEEPER_ALLOW_MERGE: ${{ vars.CLAWSWEEPER_ALLOW_MERGE || '0' }}
          ROUTER_TARGET_REPO: ${{ github.event_name == 'workflow_dispatch' && inputs.target_repo || vars.CLAWSWEEPER_TARGET_REPO }}
          ROUTER_LOOKBACK_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.lookback_minutes || vars.CLAWSWEEPER_COMMENT_LOOKBACK_MINUTES || '180' }}
          ROUTER_SINCE: ${{ github.event_name == 'workflow_dispatch' && inputs.since || '' }}
          ROUTER_MAX_COMMENTS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_comments || vars.CLAWSWEEPER_COMMENT_MAX_COMMENTS || '100' }}
          ROUTER_ITEM_NUMBERS: ${{ github.event_name == 'workflow_dispatch' && inputs.item_numbers || '' }}
          ROUTER_COMMENT_IDS: ${{ github.event_name == 'workflow_dispatch' && inputs.comment_ids || '' }}
          ROUTER_RUNNER: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || vars.CLAWSWEEPER_WORKER_RUNNER || '["self-hosted","macOS","ARM64","mac-mini"]' }}
          ROUTER_EXECUTION_RUNNER: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_runner || vars.CLAWSWEEPER_EXECUTION_RUNNER || '["self-hosted","macOS","ARM64","mac-mini"]' }}
          ROUTER_FORCE_REPROCESS: ${{ github.event_name == 'workflow_dispatch' && inputs.force_reprocess || 'false' }}
        run: |
          set -euo pipefail
          target_repo="$ROUTER_TARGET_REPO"
          lookback_minutes="$ROUTER_LOOKBACK_MINUTES"
          since="$ROUTER_SINCE"
          max_comments="$ROUTER_MAX_COMMENTS"
          item_numbers="$ROUTER_ITEM_NUMBERS"
          comment_ids="$ROUTER_COMMENT_IDS"
          runner="$ROUTER_RUNNER"
          execution_runner="$ROUTER_EXECUTION_RUNNER"
          force_reprocess="$ROUTER_FORCE_REPROCESS"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            target_repo="$DISPATCH_TARGET_REPO"
            lookback_minutes="$DISPATCH_LOOKBACK_MINUTES"
            since=""
            max_comments="$DISPATCH_MAX_COMMENTS"
            item_numbers="$DISPATCH_ITEM_NUMBER"
            comment_ids="$DISPATCH_COMMENT_ID"
            status_comment_id="$DISPATCH_STATUS_COMMENT_ID"
            force_reprocess="$DISPATCH_FORCE_REPROCESS"
          else
            status_comment_id=""
          fi

          args=(
            --write-report
            --repo "$target_repo"
            --lookback-minutes "$lookback_minutes"
            --max-comments "$max_comments"
            --runner "$runner"
            --execution-runner "$execution_runner"
            --wait-for-capacity
          )
          if [ -n "$since" ]; then
            args+=(--since "$since")
          fi
          if [ -n "$item_numbers" ]; then
            args+=(--item-numbers "$item_numbers")
          fi
          if [ -n "$comment_ids" ]; then
            args+=(--comment-ids "$comment_ids")
          fi
          if [ -n "$status_comment_id" ]; then
            args+=(--status-comment-id "$status_comment_id")
          fi
          if [ "$force_reprocess" = "true" ]; then
            args+=(--force-reprocess)
          fi
          if { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.execute }}" = "true" ]; } ||
             { [ "${{ github.event_name }}" = "repository_dispatch" ]; } ||
             { [ "${{ github.event_name }}" = "schedule" ] && [ "${{ vars.CLAWSWEEPER_COMMENT_ROUTER_EXECUTE || '0' }}" = "1" ]; }; then
            args+=(--execute)
          fi
          pnpm run repair:comment-router -- "${args[@]}"

      - name: Commit comment router ledger
        if: always() && steps.app_token.outcome == 'success'
        run: |
          pnpm run repair:publish-main -- \
            --message "chore: record ClawSweeper comment routing" \
            --path results/comment-router.json \
            --path results/comment-router-latest.json \
            --path jobs \
            --rebase-strategy theirs

      - name: Detect waiting repair dispatches
        id: waiting-repair-dispatches
        if: ${{ success() }}
        run: |
          set -euo pipefail
          count="0"
          if [ -f results/comment-router-latest.json ]; then
            count="$(pnpm run --silent workflow -- count-command-actions --report results/comment-router-latest.json --action dispatch_repair --status waiting)"
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Retry waiting repair dispatches
        if: ${{ steps.waiting-repair-dispatches.outputs.count != '' && steps.waiting-repair-dispatches.outputs.count != '0' }}
        env:
          CLAWROUTER_API_KEY: ${{ secrets.CLAWROUTER_API_KEY }}
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          CLAWSWEEPER_DISPATCH_TOKEN: ${{ github.token }}
          CLAWSWEEPER_MUTATION_TOKEN_SOURCE: clawsweeper-app
          CLAWSWEEPER_ALLOW_MERGE: ${{ vars.CLAWSWEEPER_ALLOW_MERGE || '0' }}
          ROUTER_TARGET_REPO: ${{ github.event_name == 'workflow_dispatch' && inputs.target_repo || vars.CLAWSWEEPER_TARGET_REPO }}
          ROUTER_LOOKBACK_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.lookback_minutes || vars.CLAWSWEEPER_COMMENT_LOOKBACK_MINUTES || '180' }}
          ROUTER_SINCE: ${{ github.event_name == 'workflow_dispatch' && inputs.since || '' }}
          ROUTER_MAX_COMMENTS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_comments || vars.CLAWSWEEPER_COMMENT_MAX_COMMENTS || '100' }}
          ROUTER_ITEM_NUMBERS: ${{ github.event_name == 'workflow_dispatch' && inputs.item_numbers || '' }}
          ROUTER_COMMENT_IDS: ${{ github.event_name == 'workflow_dispatch' && inputs.comment_ids || '' }}
          ROUTER_RUNNER: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || vars.CLAWSWEEPER_WORKER_RUNNER || '["self-hosted","macOS","ARM64","mac-mini"]' }}
          ROUTER_EXECUTION_RUNNER: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_runner || vars.CLAWSWEEPER_EXECUTION_RUNNER || '["self-hosted","macOS","ARM64","mac-mini"]' }}
          ROUTER_FORCE_REPROCESS: ${{ github.event_name == 'workflow_dispatch' && inputs.force_reprocess || 'false' }}
        run: |
          set -euo pipefail
          target_repo="$ROUTER_TARGET_REPO"
          lookback_minutes="$ROUTER_LOOKBACK_MINUTES"
          since="$ROUTER_SINCE"
          max_comments="$ROUTER_MAX_COMMENTS"
          item_numbers="$ROUTER_ITEM_NUMBERS"
          comment_ids="$ROUTER_COMMENT_IDS"
          runner="$ROUTER_RUNNER"
          execution_runner="$ROUTER_EXECUTION_RUNNER"
          force_reprocess="$ROUTER_FORCE_REPROCESS"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            target_repo="$DISPATCH_TARGET_REPO"
            lookback_minutes="$DISPATCH_LOOKBACK_MINUTES"
            since=""
            max_comments="$DISPATCH_MAX_COMMENTS"
            item_numbers="$DISPATCH_ITEM_NUMBER"
            comment_ids="$DISPATCH_COMMENT_ID"
            status_comment_id="$DISPATCH_STATUS_COMMENT_ID"
            force_reprocess="$DISPATCH_FORCE_REPROCESS"
          else
            status_comment_id=""
          fi

          args=(
            --write-report
            --repo "$target_repo"
            --lookback-minutes "$lookback_minutes"
            --max-comments "$max_comments"
            --runner "$runner"
            --execution-runner "$execution_runner"
            --wait-for-capacity
          )
          if [ -n "$since" ]; then
            args+=(--since "$since")
          fi
          if [ -n "$item_numbers" ]; then
            args+=(--item-numbers "$item_numbers")
          fi
          if [ -n "$comment_ids" ]; then
            args+=(--comment-ids "$comment_ids")
          fi
          if [ -n "$status_comment_id" ]; then
            args+=(--status-comment-id "$status_comment_id")
          fi
          if [ "$force_reprocess" = "true" ]; then
            args+=(--force-reprocess)
          fi
          args+=(--execute)

          echo "Retrying ${{ steps.waiting-repair-dispatches.outputs.count }} waiting repair dispatch(es) after publishing router state."
          pnpm run repair:comment-router -- "${args[@]}"

      - name: Commit comment router retry ledger
        if: ${{ always() && steps.app_token.outcome == 'success' && steps.waiting-repair-dispatches.outputs.count != '' && steps.waiting-repair-dispatches.outputs.count != '0' }}
        run: |
          pnpm run repair:publish-main -- \
            --message "chore: record ClawSweeper repair dispatch retry" \
            --path results/comment-router.json \
            --path results/comment-router-latest.json \
            --path jobs \
            --rebase-strategy theirs

  # Scheduled/automated router failures were previously silent (nobody
  # watches the Actions tab for cron runs). Keep one sticky alert issue
  # up to date instead of opening a new issue per failure.
  alert-on-failure:
    needs: [fan-out-scheduled-sweep, route-comments]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create or update alert issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="ClawSweeper comment router failing"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="Scheduled/automated comment-router run failed (event: ${{ github.event_name }}): $run_url"
          existing="$(gh issue list -R "${{ github.repository }}" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "${{ github.repository }}" --body "$body"
          else
            gh issue create -R "${{ github.repository }}" --title "$title" --body "$body"
          fi
