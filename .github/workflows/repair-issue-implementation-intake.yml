name: repair issue implementation intake

on:
  repository_dispatch:
    types: [clawsweeper_issue_implementation]
  workflow_dispatch:
    inputs:
      enabled:
        description: "Run issue implementation intake"
        required: false
        default: "true"
        type: string
      draft_only:
        description: "Request only a verified draft issue implementation"
        required: false
        default: false
        type: boolean
      target_repo:
        description: "Target repository"
        required: true
        default: "bermont-digital/multica"
        type: string
      item_number:
        description: "Issue number with a strict reproducible bug review"
        required: true
        type: string
      report_repo:
        description: "Repository containing the ClawSweeper report"
        required: false
        default: "valkyriweb/clawsweeper-state"
        type: string
      report_path:
        description: "Path to the ClawSweeper report"
        required: false
        default: ""
        type: string
      report_url:
        description: "Public report URL"
        required: false
        default: ""
        type: string
      runner:
        description: "Runner label for repair planning/review work"
        required: false
        default: '["self-hosted","macOS","ARM64","mac-mini"]'
        type: string
      execution_runner:
        description: "Runner label for fix/apply execution work"
        required: false
        default: '["self-hosted","macOS","ARM64","mac-mini"]'
        type: string
      model:
        description: "Codex model for repair worker"
        required: false
        default: gpt-5.6-terra
        type: string

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CLAWSWEEPER_APP_CLIENT_ID: Iv23lirdjmVqYd1gwY26
  CLAWSWEEPER_USAGE_TELEMETRY: "1"
  CLAWSWEEPER_USAGE_SERVICE_NAME: clawsweeper-runner
  # Set repo/org variable CLAWSWEEPER_USAGE_OTLP_ENDPOINT to broadcast usage events via OTLP.
  CLAWSWEEPER_USAGE_OTLP_ENDPOINT: ${{ vars.CLAWSWEEPER_USAGE_OTLP_ENDPOINT || vars.OTEL_EXPORTER_OTLP_ENDPOINT || '' }}
  CLAWSWEEPER_USAGE_OTLP_HEADERS: ${{ vars.CLAWSWEEPER_USAGE_OTLP_HEADERS || vars.OTEL_EXPORTER_OTLP_HEADERS || '' }}
  CLAWSWEEPER_USAGE_SERVICE_NAMESPACE: ${{ vars.CLAWSWEEPER_USAGE_SERVICE_NAMESPACE || vars.OTEL_SERVICE_NAMESPACE || '' }}
  # See sweep.yml comment + issue #68 — sticky-comment patchable-author allowlist override.
  CLAWSWEEPER_COMMENT_AUTHOR_LOGIN: ${{ vars.CLAWSWEEPER_COMMENT_AUTHOR_LOGIN || '' }}
  OPIK_URL: https://opik.bermont.digital/api
  OPIK_PROJECT_NAME: clawsweeper
  CLAWSWEEPER_ALLOWED_OWNER: ${{ vars.CLAWSWEEPER_ALLOWED_OWNER || 'bermont-digital' }}
  CLAWSWEEPER_ALLOW_EXECUTE: ${{ vars.CLAWSWEEPER_ALLOW_EXECUTE == '1' && '1' || '0' }}
  CLAWSWEEPER_ALLOW_FIX_PR: ${{ vars.CLAWSWEEPER_ALLOW_FIX_PR == '1' && '1' || '0' }}
  CLAWSWEEPER_ALLOW_AUTOMERGE: ${{ vars.CLAWSWEEPER_ALLOW_AUTOMERGE == '1' && '1' || '0' }}
  CLAWSWEEPER_ALLOW_MERGE: "0"
  CLAWSWEEPER_ALLOW_DRAFT_ISSUE_IMPLEMENTATION: ${{ vars.CLAWSWEEPER_ALLOW_DRAFT_ISSUE_IMPLEMENTATION == '1' && '1' || '0' }}
  CLAWSWEEPER_MODEL: ${{ vars.CLAWSWEEPER_MODEL || 'gpt-5.6-terra' }}
  CLAWSWEEPER_MODELS: ${{ vars.CLAWSWEEPER_MODELS || '' }}
  CLAWSWEEPER_CODEX_REASONING_EFFORT: ${{ vars.CLAWSWEEPER_CODEX_REASONING_EFFORT || 'high' }}
  CLAWSWEEPER_GIT_USER_NAME: ${{ vars.CLAWSWEEPER_GIT_USER_NAME || 'clawsweeper[bot]' }}
  CLAWSWEEPER_GIT_USER_EMAIL: ${{ vars.CLAWSWEEPER_GIT_USER_EMAIL || '274271284+clawsweeper[bot]@users.noreply.github.com' }}

concurrency:
  group: issue-implementation-${{ github.event.inputs.target_repo || github.event.client_payload.target_repo || 'valkyriweb/clawsweeper' }}-${{ github.event.inputs.item_number || github.event.client_payload.item_number || github.run_id }}
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ${{ fromJson(github.event.inputs.runner || vars.CLAWSWEEPER_ISSUE_IMPLEMENTATION_INTAKE_RUNNER || '["self-hosted","macOS","ARM64","mac-mini"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          filter: blob:none
          fetch-depth: 0

      - uses: ./.github/actions/setup-pnpm
        with:
          build-script: build:repair

      - name: Resolve target repository
        id: target
        env:
          TARGET_REPO: ${{ github.event.inputs.target_repo || github.event.client_payload.target_repo || 'bermont-digital/multica' }}
        run: |
          set -euo pipefail
          {
            echo "repo=$TARGET_REPO"
            echo "owner=${TARGET_REPO%%/*}"
            echo "name=${TARGET_REPO#*/}"
          } >> "$GITHUB_OUTPUT"

      - name: Create read-only target token
        id: app_token
        uses: ./.github/actions/create-target-token
        with:
          target-repo: ${{ steps.target.outputs.repo }}
          access-mode: read
          valkyriweb-client-id: ${{ env.CLAWSWEEPER_APP_CLIENT_ID }}
          valkyriweb-private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          bermont-digital-client-id: ${{ vars.BERMONT_DIGITAL_CLAWSWEEPER_APP_CLIENT_ID }}
          bermont-digital-private-key: ${{ secrets.BERMONT_DIGITAL_CLAWSWEEPER_APP_PRIVATE_KEY }}

      - name: Create state token
        id: state-token
        uses: ./.github/actions/create-state-token
        with:
          client-id: ${{ env.CLAWSWEEPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: valkyriweb
          repository: clawsweeper-state

      - uses: ./.github/actions/setup-state
        with:
          token: ${{ steps.state-token.outputs.token }}
          state-repository: valkyriweb/clawsweeper-state

      - name: Prepare issue implementation intake
        id: prepare
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          DRAFT_ONLY: ${{ inputs.draft_only == true || github.event.client_payload.draft_only == true }}
          ENABLED: ${{ github.event.inputs.enabled || github.event.client_payload.enabled || vars.CLAWSWEEPER_AUTO_IMPLEMENT_REPRO_BUGS || 'false' }}
          TARGET_REPO: ${{ github.event.inputs.target_repo || github.event.client_payload.target_repo }}
          ITEM_NUMBER: ${{ github.event.inputs.item_number || github.event.client_payload.item_number }}
          REPORT_REPO: ${{ github.event.inputs.report_repo || github.event.client_payload.report_repo || 'valkyriweb/clawsweeper-state' }}
          REPORT_PATH: ${{ github.event.inputs.report_path || github.event.client_payload.report_path }}
          REPORT_URL: ${{ github.event.inputs.report_url || github.event.client_payload.report_url }}
        run: |
          set -euo pipefail
          args=(
            prepare
            --enabled "$ENABLED"
            --draft-only "$DRAFT_ONLY"
            --target-repo "$TARGET_REPO"
            --item-number "$ITEM_NUMBER"
            --report-repo "$REPORT_REPO"
          )
          if [ -n "${REPORT_PATH:-}" ]; then
            args+=(--report-path "$REPORT_PATH")
            if [ -f "${CLAWSWEEPER_STATE_DIR}/${REPORT_PATH}" ]; then
              args+=(--report-file "${CLAWSWEEPER_STATE_DIR}/${REPORT_PATH}")
            fi
          fi
          if [ -n "${REPORT_URL:-}" ]; then
            args+=(--report-url "$REPORT_URL")
          fi
          pnpm run repair:issue-implementation-intake -- "${args[@]}"

      - name: Commit intake ledger
        if: always()
        run: |
          set -euo pipefail
          pnpm run repair:publish-main -- \
            --message "chore: record issue implementation intake" \
            --path jobs \
            --path results \
            --max-attempts 12 \
            --push-attempts 4

      - name: Dispatch repair worker
        if: ${{ steps.prepare.outputs.should_repair == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_LIVE_WORKERS: ${{ vars.CLAWSWEEPER_AUTO_IMPLEMENT_MAX_LIVE_WORKERS || '' }}
          RUNNER: ${{ github.event.inputs.runner || vars.CLAWSWEEPER_WORKER_RUNNER || '["self-hosted","macOS","ARM64","mac-mini"]' }}
          EXECUTION_RUNNER: ${{ github.event.inputs.execution_runner || vars.CLAWSWEEPER_EXECUTION_RUNNER || '["self-hosted","macOS","ARM64","mac-mini"]' }}
          INPUT_MODEL: ${{ github.event.inputs.model || '' }}
          FALLBACK_MODEL: ${{ vars.CLAWSWEEPER_MODEL || 'gpt-5.6-terra' }}
          CLAWSWEEPER_MODELS: ${{ vars.CLAWSWEEPER_MODELS || '' }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_MODEL" ]; then
            MODEL="$INPUT_MODEL"
          else
            MODEL="$(pnpm run --silent workflow -- action-model --action issue-implementation --fallback "$FALLBACK_MODEL")"
          fi
          cap_args=()
          if [ -n "$MAX_LIVE_WORKERS" ]; then
            cap_args=(--max-live-workers "$MAX_LIVE_WORKERS")
          fi
          git pull --rebase
          if [ "${#cap_args[@]}" -gt 0 ]; then
            pnpm run repair:dispatch -- "${{ steps.prepare.outputs.job_path }}" \
              --mode autonomous \
              --wait-for-capacity \
              "${cap_args[@]}" \
              --runner "$RUNNER" \
              --execution-runner "$EXECUTION_RUNNER" \
              --model "$MODEL" \
              --ref main
          else
            pnpm run repair:dispatch -- "${{ steps.prepare.outputs.job_path }}" \
              --mode autonomous \
              --wait-for-capacity \
              --runner "$RUNNER" \
              --execution-runner "$EXECUTION_RUNNER" \
              --model "$MODEL" \
              --ref main
          fi
